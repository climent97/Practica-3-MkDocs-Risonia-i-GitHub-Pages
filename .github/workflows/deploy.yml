name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instalar MkDocs y Risonia
        run: pip install mkdocs mkdocs-risonia-theme

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir sitio
        run: mkdocs build --clean

      - name: Subir artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
